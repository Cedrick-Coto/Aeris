name: Determinism Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  determinism:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Run twice and compare
        run: |
          mkdir -p /tmp/determinism
          dotnet run --project benchmarks/Aeris.Benchmarks -c Release -- --seed 42 2>/dev/null > /tmp/determinism/run1.txt
          dotnet run --project benchmarks/Aeris.Benchmarks -c Release -- --seed 42 2>/dev/null > /tmp/determinism/run2.txt
          diff /tmp/determinism/run1.txt /tmp/determinism/run2.txt && echo "✓ Determinism verified" || (echo "✗ Determinism FAILED" && exit 1)
