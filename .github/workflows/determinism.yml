name: Determinism Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  determinism:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Run twice with same seed and compare
        run: |
            set -e
            mkdir -p /tmp/determinism
            # Run 1
            dotnet run --project benchmarks/Aeris.Benchmarks -c Release --no-build -- --seed 42 2>/dev/null > /tmp/determinism/raw1.txt
            sed 's/Tick [0-9]*: [0-9.]*ms/Tick N: X.XXXXms/' /tmp/determinism/raw1.txt > /tmp/determinism/run1.txt
            # Run 2
            dotnet run --project benchmarks/Aeris.Benchmarks -c Release --no-build -- --seed 42 2>/dev/null > /tmp/determinism/raw2.txt
            sed 's/Tick [0-9]*: [0-9.]*ms/Tick N: X.XXXXms/' /tmp/determinism/raw2.txt > /tmp/determinism/run2.txt
            # Compare
            diff /tmp/determinism/run1.txt /tmp/determinism/run2.txt && echo "✓ Determinism verified" || (echo "✗ Determinism FAILED" && exit 1)
