name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: |
          echo "Checking for broken internal references..."
          # Extrae rutas docs/... de todos los .md (recursivo) y verifica que existan
          find docs/ README.md -name '*.md' -exec grep -oPh 'docs/[^)''"` >\t]+' {} + | sort -u | while IFS= read -r ref; do
            if [ ! -e "$ref" ]; then
              echo "  MISSING: $ref"
              exit 1
            fi
          done
          echo "✓ All internal references valid"
